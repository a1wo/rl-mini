[project]
name = "rl-mini"
version = "0.1.0"
description = "Minimal, runnable RL experiments: GRPO on MNIST in numpy, and RLVR on a small LLM with modal-dojo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Only needed for experiments/llm_gsm8k.py (pulls in Modal + modal-dojo).
llm = ["modal-dojo"]
dev = ["pytest>=8"]

[tool.uv.sources]
modal-dojo = { git = "https://github.com/modal-projects/modal-dojo.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rl_mini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
